<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Count Up Timer - Compact Green Screen</title>

<style>
  :root {
    --key-green: #00ff00;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
  }

  body {
    background: var(--key-green);
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .wrap {
    width: 100%;
    text-align: center;
  }

  /* TIMER COMPACT */
  .timer {
    display: inline-flex;
    align-items: center;
    justify-content: center;

    /* Hampir tidak ada jarak antar bagian */
    gap: 0;

    background: rgba(0, 0, 0, .86);
    border-radius: 18px;

    padding: 14px 18px 12px;
  }

  .unit {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .number {
    font-family: "Courier New", monospace;
    font-weight: 800;

    /* Ukuran angka */
    font-size: clamp(36px, 8vw, 100px);

    line-height: .9;

    font-variant-numeric: tabular-nums;

    text-shadow: 0 2px 2px rgba(0,0,0,.35);

    /* Menghilangkan ruang bawaan */
    margin: 0;
    padding: 0;
  }

  .label {
    margin-top: 9px;

    font-size: clamp(9px, 1.4vw, 18px);

    font-weight: 700;

    letter-spacing: .04em;

    line-height: 1;
  }

  /* TITIK DUA */
  .separator {
    font-family: "Courier New", monospace;

    font-weight: 800;

    font-size: clamp(36px, 8vw, 100px);

    line-height: .85;

    margin: 0;

    padding: 0;

    /* Membuat : sangat dekat dengan angka */
    width: auto;

    transform: translateY(-3px);
  }

  /* Layar kecil */
  @media (max-width: 520px) {

    .timer {
      border-radius: 12px;
      padding: 10px 10px 9px;
    }

    .number {
      font-size: clamp(28px, 9vw, 60px);
    }

    .separator {
      font-size: clamp(28px, 9vw, 60px);
      transform: translateY(-2px);
    }

    .label {
      margin-top: 7px;
      font-size: 9px;
    }
  }
</style>
</head>

<body>

  <main class="wrap" aria-label="Timer count up">

    <section class="timer" aria-live="off">

      <div class="unit">
        <div class="number" id="days">00</div>
        <div class="label">HARI</div>
      </div>

      <div class="separator">:</div>

      <div class="unit">
        <div class="number" id="hours">00</div>
        <div class="label">JAM</div>
      </div>

      <div class="separator">:</div>

      <div class="unit">
        <div class="number" id="minutes">00</div>
        <div class="label">MENIT</div>
      </div>

      <div class="separator">:</div>

      <div class="unit">
        <div class="number" id="seconds">00</div>
        <div class="label">DETIK</div>
      </div>

    </section>

  </main>

<script>
  // ==========================================
  // WAKTU MULAI
  // Sabtu, 26 September 2026 20:46:00 WIB
  // UTC+7
  //
  // UTC = 26 September 2026 13:46:00
  // ==========================================

  const startTime = Date.UTC(2026, 8, 26, 13, 46, 0);

  const pad = n => String(n).padStart(2, "0");

  function updateTimer() {

    const elapsed = Math.max(
      0,
      Date.now() - startTime
    );

    const totalSeconds = Math.floor(
      elapsed / 1000
    );

    const days = Math.floor(
      totalSeconds / 86400
    );

    const hours = Math.floor(
      (totalSeconds % 86400) / 3600
    );

    const minutes = Math.floor(
      (totalSeconds % 3600) / 60
    );

    const seconds =
      totalSeconds % 60;

    document.getElementById("days").textContent =
      pad(days);

    document.getElementById("hours").textContent =
      pad(hours);

    document.getElementById("minutes").textContent =
      pad(minutes);

    document.getElementById("seconds").textContent =
      pad(seconds);
  }

  updateTimer();

  setInterval(updateTimer, 250);
</script>

</body>
</html>
